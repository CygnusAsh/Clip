<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Cygnus Ash</title>

  <link rel="stylesheet" href="./snow.css" />
</head>

<body>
  <!-- 🎵 BGM -->
  <audio id="bgm" src="./bgm.mp3" loop playsinline></audio>

  <!-- ❄️ 雪 -->
  <canvas id="snow"></canvas>

  <!-- 🎛 UI -->
  <div class="audio-ui">
    <button id="toggle">▶</button>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">
  </div>

  <!-- メイン -->
  <main class="hero">
    <h1>Cygnus Ash</h1>
  </main>

  <script src="./snow.js"></script>

  <script>
    // ===== BGM制御 =====
    const bgm = document.getElementById("bgm");
    const toggle = document.getElementById("toggle");
    const volume = document.getElementById("volume");

    bgm.volume = 0.5;

    // 最初は止まってる状態
    let started = false;

    function startBGM() {
      if (started) return;
      started = true;

      // フェードイン再生
      bgm.volume = 0;
      bgm.play().catch(() => {});

      let v = 0;
      const fade = setInterval(() => {
        v += 0.02;
        bgm.volume = v;
        if (v >= 0.5) clearInterval(fade);
      }, 100);

      toggle.textContent = "⏸";
    }

    // 👇 最初のタップで確実再生（スマホ対応）
    window.addEventListener("click", startBGM, { once: true });
    window.addEventListener("touchstart", startBGM, { once: true });

    // 再生/停止
    toggle.addEventListener("click", () => {
      if (bgm.paused) {
        bgm.play();
        toggle.textContent = "⏸";
      } else {
        bgm.pause();
        toggle.textContent = "▶";
      }
    });

    // 音量
    volume.addEventListener("input", () => {
      bgm.volume = volume.value;
    });
  </script>
</body>
</html>
