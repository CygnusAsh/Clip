<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cygnus Ash</title>

<link rel="stylesheet" href="./snow.css">
</head>

<body>

<audio id="bgm" src="./bgm.mp3" loop playsinline></audio>

<canvas id="snow"></canvas>

<div class="audio-ui">
  <button id="toggle">▶</button>
  <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">
</div>

<main class="hero">
  <h1>Cygnus Ash</h1>
</main>

<script src="./snow.js"></script>

<script>
const bgm = document.getElementById("bgm");
const toggle = document.getElementById("toggle");
const volume = document.getElementById("volume");

bgm.volume = 0.5;

let started = false;

// 👇 最初のタップで再生
function startBGM() {
  if (started) return;
  started = true;

  bgm.volume = 0;
  bgm.play().catch(()=>{});

  let v = 0;
  const fade = setInterval(()=>{
    v += 0.02;
    bgm.volume = v;
    if(v >= 0.5) clearInterval(fade);
  },100);

  toggle.textContent = "⏸";
}

window.addEventListener("click", startBGM, { once: true });
window.addEventListener("touchstart", startBGM, { once: true });

toggle.onclick = () => {
  if (bgm.paused) {
    bgm.play();
    toggle.textContent = "⏸";
  } else {
    bgm.pause();
    toggle.textContent = "▶";
  }
};

volume.oninput = () => {
  bgm.volume = volume.value;
};
</script>

</body>
</html>
