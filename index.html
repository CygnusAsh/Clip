<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cygnus Ash</title>

<style>
* { box-sizing: border-box; }

html, body {
  margin: 0;
  height: 100dvh;
  background: #000;
  overflow: hidden;
  font-family: serif;
  cursor: pointer;
}

/* ===== イントロ ===== */
.intro {
  position: fixed;
  inset: 0;
  display: grid;
  place-items: center;
}

/* 完全黒＋微光 */
.bg {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at center, #111 0%, #000 70%);
  transition: 1.2s ease;
}

/* 微光レイヤー */
.glow {
  position: absolute;
  inset: 0;
  background:
    radial-gradient(circle at center, rgba(255,255,255,0.05), transparent 60%);
  opacity: 1;
  transition: 1s;
}

.content {
  position: relative;
  z-index: 2;
  text-align: center;
}

h1 {
  color: rgba(255,255,255,0.9);
  font-size: clamp(3rem, 10vw, 7rem);
  letter-spacing: 0.1em;
  text-shadow: 0 0 20px rgba(255,255,255,0.2);
}

.hint {
  margin-top: 1rem;
  color: rgba(255,255,255,0.6);
  font-size: 0.9rem;
  letter-spacing: 0.15em;
}

/* クリック後 */
.intro.open .glow {
  opacity: 0;
}

.intro.open h1 {
  opacity: 0;
  filter: blur(4px);
  transform: scale(1.05);
  transition: 1s;
}
</style>
</head>

<body>

<div class="intro" id="intro">
  <div class="bg"></div>
  <div class="glow"></div>

  <div class="content">
    <h1>Ash</h1>
    <div class="hint">click to enter</div>
  </div>
</div>

<script>
const intro = document.getElementById("intro");
let opened = false;

function openPage() {
  if (opened) return;
  opened = true;

  intro.classList.add("open");

  // 少し余韻持たせて遷移
  setTimeout(() => {
    location.href = "./TopPage/snow.html";
  }, 1200);
}

window.addEventListener("click", openPage);
window.addEventListener("touchstart", openPage, { passive: true });
</script>

</body>
</html>
