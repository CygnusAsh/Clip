<script>
// ===== 要素 =====
const intro = document.getElementById("intro");
const main = document.getElementById("main");
const ui = document.getElementById("ui");
const overlay = document.getElementById("overlayText");

const bgm = document.getElementById("bgm");
const toggle = document.getElementById("toggle");
const volume = document.getElementById("volume");

bgm.volume = 0;

let started = false;

// ===== 雪 =====
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flakes = [];
const count = innerWidth < 600 ? 120 : 200;

function resize() {
  const dpr = devicePixelRatio || 1;
  canvas.width = innerWidth * dpr;
  canvas.height = innerHeight * dpr;
  canvas.style.width = innerWidth + "px";
  canvas.style.height = innerHeight + "px";
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
}

function createFlake() {
  return {
    x: Math.random()*innerWidth,
    y: Math.random()*innerHeight,
    r: Math.random()*2,
    vy: Math.random()+0.3
  };
}

function initSnow() {
  flakes = [];
  for(let i=0;i<count;i++) flakes.push(createFlake());
}

function animateSnow() {
  ctx.clearRect(0,0,canvas.width,canvas.height);

  flakes.forEach(f=>{
    f.y += f.vy;
    if(f.y > innerHeight) f.y = 0;

    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle = "white";
    ctx.fill();
  });

  requestAnimationFrame(animateSnow);
}

// ===== 復元（ここが追加ポイント） =====
window.addEventListener("DOMContentLoaded", () => {

  if(sessionStorage.getItem("visited")){
    // イントロ消す
    intro.style.display = "none";
    main.classList.add("show");

    // 雪
    resize();
    initSnow();
    animateSnow();

    // UI
    ui.classList.add("show");

    // メニュー
    setTimeout(()=>{
      overlay.classList.add("show");
    },500);

    return;
  }

});

// ===== 開始 =====
function startExperience() {
  if (started) return;
  started = true;

  // 👇 訪問フラグ保存（超重要）
  sessionStorage.setItem("visited", "true");

  intro.classList.add("open");

  setTimeout(() => {
    bgm.play().catch(()=>{});
    let v = 0;
    const fade = setInterval(()=>{
      v += 0.02;
      bgm.volume = v;
      if(v >= 0.5) clearInterval(fade);
    },100);

    resize();
    initSnow();
    animateSnow();

    ui.classList.add("show");

    setTimeout(()=>{
      overlay.classList.add("show");
    },1500);

  }, 1000);

  setTimeout(() => {
    intro.style.display = "none";
    main.classList.add("show");
  }, 1200);
}

// ===== UI =====
toggle.onclick = () => {
  if (bgm.paused) {
    bgm.play();
    toggle.textContent = "⏸";
  } else {
    bgm.pause();
    toggle.textContent = "▶";
  }
};

volume.oninput = () => {
  bgm.volume = volume.value;
};

// ===== メニュークリック =====
document.querySelectorAll(".menu-btn").forEach(btn=>{
  btn.addEventListener("click",e=>{
    e.preventDefault();

    overlay.classList.add("selecting");
    btn.classList.add("selected");

    setTimeout(()=>{
      window.location.href = btn.getAttribute("href");
    },800);
  });
});

// ===== イベント =====
window.addEventListener("click", startExperience, { once: true });
window.addEventListener("touchstart", startExperience, { once: true });

window.onresize = () => {
  resize();
  initSnow();
};
</script>
