<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Cygnus Ash</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: "Georgia", "Times New Roman", "Yu Mincho", serif;
      cursor: pointer;
    }

    .intro {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    .bg {
      position: absolute;
      inset: -20px;
      background:
        linear-gradient(rgba(0, 0, 0, 0.28), rgba(0, 0, 0, 0.58)),
        url("./TopPage/TopPage.png") center center / cover no-repeat;
      filter: blur(12px) brightness(0.8);
      transform: scale(1.08);
      transition:
        filter 1.3s ease,
        transform 1.3s ease,
        opacity 1.3s ease;
    }

    .fog {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 50% 50%, rgba(255,255,255,0.06), transparent 35%),
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.04), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.03), transparent 25%);
      opacity: 1;
      transition: opacity 1.1s ease;
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;
      display: grid;
      place-items: center;
      text-align: center;
      padding: 2rem;
    }

    .title-wrap {
      transition:
        opacity 0.9s ease,
        transform 1.1s ease,
        filter 1.1s ease;
    }

    h1 {
      margin: 0;
      color: rgba(255,255,255,0.96);
      font-size: clamp(4rem, 11vw, 8rem);
      font-weight: 400;
      letter-spacing: 0.08em;
      text-shadow:
        0 0 10px rgba(255,255,255,0.18),
        0 0 25px rgba(255,255,255,0.08),
        0 2px 16px rgba(0,0,0,0.7);
    }

    .hint {
      margin-top: 1rem;
      color: rgba(255,255,255,0.72);
      font-size: clamp(0.9rem, 1.8vw, 1rem);
      letter-spacing: 0.15em;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.65);
    }

    .intro.open .bg {
      filter: blur(0px) brightness(0.95);
      transform: scale(1.02);
    }

    .intro.open .fog {
      opacity: 0;
    }

    .intro.open .title-wrap {
      opacity: 0;
      transform: scale(1.04);
      filter: blur(4px);
    }

    .vignette {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at center, transparent 45%, rgba(0,0,0,0.28) 100%);
      z-index: 1;
    }
  </style>
</head>
<body>
  <div class="intro" id="intro">
    <div class="bg"></div>
    <div class="fog"></div>
    <div class="vignette"></div>

    <div class="content">
      <div class="title-wrap">
        <h1>Ash</h1>
        <div class="hint">click to enter</div>
      </div>
    </div>
  </div>

  <script>
    const intro = document.getElementById("intro");
    let opened = false;

    function openPage() {
      if (opened) return;
      opened = true;

      intro.classList.add("open");

      setTimeout(() => {
        window.location.href = "./TopPage/snow.html";
      }, 1250);
    }

    window.addEventListener("click", openPage);
    window.addEventListener("touchstart", openPage, { passive: true });
    window.addEventListener("keydown", (e) => {
      if (e.key === "Enter" || e.key === " " || e.key === "Spacebar") {
        openPage();
      }
    });
  </script>
</body>
</html>
