<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome...</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:serif;
  cursor:pointer;
}

/* ===== イントロ ===== */
.intro{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  z-index:10;
}

.bg{
  position:absolute;
  inset:0;
  background:radial-gradient(circle,#111,#000);
  transition:1.2s;
}

.glow{
  position:absolute;
  inset:0;
  background:radial-gradient(circle,rgba(255,255,255,0.05),transparent);
  transition:1s;
}

.intro.open .glow{
  opacity:0;
}

h1{
  color:white;
  font-size:clamp(3rem,10vw,7rem);
  letter-spacing:0.1em;
  transition:.15s;
}

.intro.open h1{
  opacity:0;
  filter:blur(4px);
  transform:scale(1.05);
}

/* ===== メイン ===== */
#main{
  opacity:0;
  transition:1s;
}

#main.show{opacity:1;}

#snow{
  position:fixed;
  inset:0;
}

/* ===== UI ===== */
.audio-ui{
  position:fixed;
  top:12px;
  left:12px;
  z-index:20;
  display:flex;
  gap:10px;
  padding:8px 12px;
  border-radius:999px;
  background:rgba(0,0,0,0.4);
  opacity:0;
  transition:1s;
}

.audio-ui.show{opacity:1;}

button{
  background:none;
  border:none;
  color:white;
  cursor:pointer;
}

input{
  width:80px;
}
</style>
</head>

<body>

<!-- 🎵 BGM -->
<audio id="bgm" src="./TopPage/bgm.mp3" loop playsinline></audio>

<!-- イントロ -->
<div class="intro" id="intro">
  <div class="bg"></div>
  <div class="glow"></div>
  <h1>Ash</h1>
</div>

<!-- メイン -->
<div id="main">
  <canvas id="snow"></canvas>

  <div class="audio-ui" id="ui">
    <button id="toggle">⏸</button>
    <input id="volume" type="range" min="0" max="1" step="0.01" value="0.5">
  </div>

  <div style="position:relative;z-index:2;height:100%;display:grid;place-items:center;">
    <h1 id="title">Welcome...</h1>
  </div>
</div>

<script>
const bgm = document.getElementById("bgm");
const intro = document.getElementById("intro");
const main = document.getElementById("main");
const ui = document.getElementById("ui");
const title = document.getElementById("title");
const toggle = document.getElementById("toggle");
const volume = document.getElementById("volume");

let started = false;
bgm.volume = 0;

/* ===== BPM設定 ===== */
const BPM = 120; // ←ここ変える
const beatInterval = 60000 / BPM;

let startTime = 0;
let lastBeat = -1;

/* ===== 雪 ===== */
const canvas = document.getElementById("snow");
const ctx = canvas.getContext("2d");

let flakes = [];

function resize(){
  const dpr = devicePixelRatio||1;
  canvas.width=innerWidth*dpr;
  canvas.height=innerHeight*dpr;
  canvas.style.width=innerWidth+"px";
  canvas.style.height=innerHeight+"px";
  ctx.setTransform(1,0,0,1,0,0);
  ctx.scale(dpr,dpr);
}

function createFlake(){
  return{
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*2,
    vy:Math.random()+0.3
  };
}

function initSnow(){
  flakes=[];
  for(let i=0;i<200;i++){
    flakes.push(createFlake());
  }
}

/* ===== アニメーション ===== */
function animate(){
  ctx.clearRect(0,0,canvas.width,canvas.height);

  const now = performance.now();
  const elapsed = now - startTime;

  const beatIndex = Math.floor(elapsed / beatInterval);
  let isBeat = false;

  if(beatIndex !== lastBeat){
    lastBeat = beatIndex;
    isBeat = true;
  }

  /* 🎯 ビート同期 */
  if(isBeat){
    title.style.transform = "scale(1.1)";
    title.style.textShadow = "0 0 50px #fff";

    setTimeout(()=>{
      title.style.transform = "scale(1)";
      title.style.textShadow = "0 0 20px rgba(255,255,255,0.2)";
    },120);
  }

  flakes.forEach(f=>{
    f.y += f.vy;

    if(isBeat){
      f.y += 8;
    }

    if(f.y > innerHeight) f.y = 0;

    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

/* ===== 開始 ===== */
function start(){
  if(started) return;
  started = true;

  intro.classList.add("open");

  setTimeout(()=>{
    bgm.play().catch(()=>{});

    // フェードイン
    let v=0;
    const fade=setInterval(()=>{
      v+=0.02;
      bgm.volume=v;
      if(v>=0.5) clearInterval(fade);
    },100);

    startTime = performance.now();

    resize();
    initSnow();
    animate();

    ui.classList.add("show");
  },1000);

  setTimeout(()=>{
    intro.style.display="none";
    main.classList.add("show");
  },1200);
}

/* ===== UI ===== */
toggle.onclick = ()=>{
  if(bgm.paused){
    bgm.play();
    toggle.textContent="⏸";
  }else{
    bgm.pause();
    toggle.textContent="▶";
  }
};

volume.oninput = ()=>{
  bgm.volume = volume.value;
};

/* ===== イベント ===== */
window.addEventListener("click", start, {once:true});
window.addEventListener("touchstart", start, {once:true});
window.onresize = resize;
</script>

</body>
</html>
