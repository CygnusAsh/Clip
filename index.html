<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome...</title>

<style>
html,body{
  margin:0;
  height:100%;
  background:#000;
  overflow:hidden;
  font-family:serif;
}

/* ===== イントロ ===== */
.intro{
  position:fixed;
  inset:0;
  display:grid;
  place-items:center;
  z-index:10;
  color:white;
}

.intro.open{
  opacity:0;
  transition:1s;
}

/* ===== メイン ===== */
#main{
  opacity:0;
  transition:1s;
}

#main.show{
  opacity:1;
}

/* ===== 雪 ===== */
#snow{
  position:fixed;
  inset:0;
}

/* ===== タイトル ===== */
.title{
  position:fixed;
  top:80px;
  left:50%;
  transform:translateX(-50%);
  color:white;
  font-size:3rem;
  font-weight:800;
  opacity:0;
  transition:1s;
}

#main.show .title{
  opacity:1;
}

/* ===== メニュー ===== */
.overlay-text{
  position:fixed;
  inset:0;
  display:flex;
  justify-content:center;
  align-items:center;
  gap:100px;
  transform:translateY(80px);
}

.menu-btn{
  color:white;
  text-decoration:none;
  font-size:2rem;
  font-weight:700;
  opacity:0;
  transition:1s;
}

.overlay-text.show .menu-btn{
  opacity:1;
}

/* ===== フェード ===== */
.fade-out{
  opacity:0;
  transition:1s;
}
</style>
</head>

<body>

<div class="intro" id="intro">
  <h1>Welcome...</h1>
</div>

<div id="main">
  <canvas id="snow"></canvas>

  <h1 class="title">Project Aincrad</h1>

  <div id="overlayText" class="overlay-text">
    <a href="KillClip/KillClip.html" class="menu-btn">Kill Clip</a>
    <a href="CombatLog/CombatLog.html" class="menu-btn">Combat Log</a>
  </div>
</div>

<script>
// ===== 要素 =====
const intro = document.getElementById("intro");
const main = document.getElementById("main");
const overlay = document.getElementById("overlayText");

// ===== 雪 =====
const canvas = document.getElementById("snow");

let ctx;
let flakes = [];

if(canvas){
  ctx = canvas.getContext("2d");
}

function resize(){
  if(!canvas) return;
  canvas.width = innerWidth;
  canvas.height = innerHeight;
}

function createFlake(){
  return {
    x:Math.random()*innerWidth,
    y:Math.random()*innerHeight,
    r:Math.random()*2,
    vy:Math.random()+0.3
  };
}

function init(){
  flakes=[];
  for(let i=0;i<150;i++) flakes.push(createFlake());
}

function animate(){
  if(!ctx) return;

  ctx.clearRect(0,0,canvas.width,canvas.height);

  flakes.forEach(f=>{
    f.y+=f.vy;
    if(f.y>innerHeight)f.y=0;

    ctx.beginPath();
    ctx.arc(f.x,f.y,f.r,0,Math.PI*2);
    ctx.fillStyle="white";
    ctx.fill();
  });

  requestAnimationFrame(animate);
}

// ===== 戻ったときスキップ =====
window.addEventListener("DOMContentLoaded", () => {

  if(sessionStorage.getItem("visited")){
    intro.style.display = "none";
    main.classList.add("show");

    resize();
    init();
    animate();

    if(overlay){
      setTimeout(()=>overlay.classList.add("show"),500);
    }

    return;
  }
});

// ===== 開始 =====
function startExperience(){
  sessionStorage.setItem("visited","true");

  intro.classList.add("open");

  setTimeout(()=>{
    intro.style.display="none";
    main.classList.add("show");

    resize();
    init();
    animate();

    if(overlay){
      setTimeout(()=>overlay.classList.add("show"),1000);
    }

  },1000);
}

window.addEventListener("click", startExperience, {once:true});

// ===== メニュークリック =====
document.querySelectorAll(".menu-btn").forEach(btn=>{
  btn.addEventListener("click",e=>{
    e.preventDefault();

    document.body.classList.add("fade-out");

    setTimeout(()=>{
      window.location.href = btn.href;
    },800);
  });
});

// ===== リサイズ =====
window.onresize = resize;
</script>

</body>
</html>
